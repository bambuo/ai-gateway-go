services:
  gateway:
    build: .
    ports:
      - "8443:8443"
    volumes:
      - ./config.yaml:/etc/cc-gateway/config.yaml:ro
      - ./certs:/etc/cc-gateway/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8443/_health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
